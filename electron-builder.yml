appId: com.messhm.geni
productName: GenI
copyright: Copyright © 2026 MesshM

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - resources/**/*
  - package.json

# sharp (recompresion PNG->WEBP) y onnxruntime-node (traductor local) traen
# binarios nativos; un .node/.dll no se puede requerir desde dentro del asar.
asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
  - node_modules/onnxruntime-node/**/*
  - node_modules/@huggingface/transformers/**/*

# Sin extraResources: las recetas se derivan de los modelos instalados,
# no hay JSON que empaquetar.

# Sin firma de codigo: Windows mostrara SmartScreen la primera vez.
# Es esperable en apps propias sin certificado (cuesta ~300 USD/anio).
win:
  # PNG cuadrado (>=256px); electron-builder lo convierte solo a .ico para
  # el exe, el instalador y el desinstalador (mismo icono en los tres).
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GenI
  # Preserva los datos del usuario entre actualizaciones:
  # la base y los ajustes viven en %APPDATA%\geni, no en la carpeta del programa.
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: MesshM
  repo: GenI
  releaseType: release
